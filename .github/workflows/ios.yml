# Compila el IPA en un runner macOS de GitHub, firmando con certificado propio.
#
# Alternativa a EAS Build: acá el paso de firma es visible. `security find-identity`
# imprime si la identidad quedó realmente importada, que es justo lo que EAS oculta
# detrás de "hasn't been imported successfully".
#
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   IOS_P12_BASE64      -> base64 del .p12   (ver README para generarlo)
#   IOS_P12_PASSWORD    -> contraseña del .p12
#   IOS_PROFILE_BASE64  -> base64 del .mobileprovision
name: Compilar IPA iOS

on:
  workflow_dispatch:

env:
  BUNDLE_ID: app.carrot4037.persimmon1148
  TEAM_ID: J87YM9ZQCJ
  SCHEME: EALU

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Importar certificado y perfil al llavero
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null

          echo "::group::Identidades de firma disponibles"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "::endgroup::"

          # Si no hay ninguna identidad válida, cortar acá con un mensaje claro
          # en vez de fallar más adelante dentro de xcodebuild.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "valid identities found"; then
            echo "No se importó ninguna identidad de firma válida."
            exit 1
          fi

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/perfil.mobileprovision"

          # El nombre (UUID) del perfil es lo que xcodebuild espera en exportOptions.
          UUID=$(security cms -D -i "$PROFILES_DIR/perfil.mobileprovision" \
            | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$PROFILES_DIR/perfil.mobileprovision" \
            | plutil -extract Name raw -)
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Perfil: $NAME ($UUID)"

      - name: Generar proyecto iOS nativo
        run: npx expo prebuild --platform ios --no-install

      - name: Compilar archivo .xcarchive
        run: |
          set -euo pipefail
          cd ios

          # SDK 57 usa Swift Package Manager: normalmente hay .xcodeproj y no
          # .xcworkspace. Solo existe workspace si el proyecto trae CocoaPods.
          if [ -f Podfile ]; then
            pod install --repo-update
          fi
          if compgen -G "*.xcworkspace" > /dev/null; then
            CONTAINER=(-workspace "$(ls -d *.xcworkspace | head -1)")
          else
            CONTAINER=(-project "$(ls -d *.xcodeproj | head -1)")
          fi
          echo "Contenedor: ${CONTAINER[*]}"

          # El scheme lo genera prebuild a partir del nombre de la app; leerlo
          # es más seguro que asumirlo.
          SCHEME=$(xcodebuild -list -json "${CONTAINER[@]}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log((j.project||j.workspace).schemes[0])})")
          echo "Scheme detectado: $SCHEME"
          echo "SCHEME_REAL=$SCHEME" >> "$GITHUB_ENV"

          xcodebuild archive \
            "${CONTAINER[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Exportar IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates

      - name: Publicar el IPA
        uses: actions/upload-artifact@v4
        with:
          name: ealu-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Limpiar llavero
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
